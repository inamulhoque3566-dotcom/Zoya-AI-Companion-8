name: Build Zoya APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Unzip all 4 parts
        run: |
          ls -la
          for z in Zoya_part*_of_4.zip; do
            echo "Unzipping $z"
            unzip -oq "$z"
          done
          test -d android/app
          sed -i 's/8\.5\.2/8.7.2/g' android/build.gradle.kts

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build web app
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Copy web build into Android assets
        run: |
          mkdir -p android/app/src/main/assets/www
          cp -r dist/* android/app/src/main/assets/www/
          mkdir -p android/app/src/main/res/drawable && printf '%s' '<vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24"><path android:fillColor="#FFFFFF" android:pathData="M12,14c1.66,0 3,-1.34 3,-3V5c0,-1.66 -1.34,-3 -3,-3S9,3.34 9,5v6c0,1.66 1.34,3 3,3zM17.3,11c0,3 -2.54,5.1 -5.3,5.1S6.7,14 6.7,11H5c0,3.41 2.72,6.23 6,6.72V21h2v-3.28c3.28,-0.48 6,-3.3 6,-6.72h-1.7z"/></vector>' > android/app/src/main/res/drawable/ic_mic.xml && printf '%s' '<resources><string name="state_verify_fingerprint">Verifying</string><string name="state_failed_fingerprint">Failed</string></resources>' > android/app/src/main/res/values/extra_strings.xml

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        working-directory: android
        env:
          FIREBASE_ENABLED: "false"
        run: gradle assembleStandardDebug --stacktrace

      - name: Collect APK
        run: |
          APK=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)
          test -n "$APK"
          cp "$APK" zoya-ai-debug.apk
          ls -lh zoya-ai-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: zoya-ai-debug-apk
          path: zoya-ai-debug.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Zoya AI APK (Build ${{ github.run_number }})
          files: zoya-ai-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
