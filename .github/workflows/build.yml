name: Build Zoya APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project and Android wrapper
        run: |
          for z in Zoya_part*_of_4.zip; do
            unzip -oq "$z"
          done
          rm -rf android
          unzip -oq ZoyaApkWrapper.zip
          test -f package.json
          test -f android/app/build.gradle

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build web app
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Copy web build into Android assets
        run: |
          mkdir -p android/app/src/main/assets
          cp -r dist/* android/app/src/main/assets/
      - name: Point app to Render server
        run: |
          grep -rn "loadUrl" android/app/src || true
          grep -rl "loadUrl(" android/app/src | xargs -r sed -i -E 's#loadUrl\("[^"]*"\)#loadUrl("https://zoya-ai-companion-8.onrender.com/")#g'
          grep -rn "loadUrl" android/app/src || true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        working-directory: android
        run: gradle assembleDebug --stacktrace

      - name: Collect APK
        run: |
          APK=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)
          test -n "$APK"
          cp "$APK" zoya-ai-debug.apk
          ls -lh zoya-ai-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: zoya-ai-debug-apk
          path: zoya-ai-debug.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.${{ github.run_number }}
          name: Zoya AI APK (Build ${{ github.run_number }})
          files: zoya-ai-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
